<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ナンバープレート検出+認識 (WASM)</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1220; --card:#1a1f36; --fg:#e8ecff; --mut:#98a2c8; --acc:#6ea8fe; --ok:#3ddc84; }
  * { box-sizing:border-box; } body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:820px; margin:0 auto; padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; } .sub { color:var(--mut); font-size:13px; margin:0 0 14px; }
  #status { font-size:13px; color:var(--mut); margin-bottom:10px; }
  .stage { position:relative; width:100%; aspect-ratio:4/3; background:#000; border-radius:12px; overflow:hidden; }
  video, canvas#ov { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  canvas#ov { pointer-events:none; }
  .row { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 16px; background:var(--acc); color:#08122b; font-weight:700; cursor:pointer; }
  button.ghost { background:#2a3157; color:var(--fg); } button:disabled{opacity:.5;cursor:default;}
  #plates { margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .plate { background:#eef3ff; color:#0b1020; border-radius:10px; padding:10px 14px; box-shadow:inset 0 0 0 3px #2f6f2f; }
  .plate .region { font-size:17px; font-weight:700; } .plate .big { font-size:30px; font-weight:800; letter-spacing:2px; }
  .mut { color:var(--mut); font-size:12px; } code { background:#10142a; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ナンバープレート 検出 + 認識 · WebAssembly</h1>
  <p class="sub">YOLOX(検出)→ 切り出し → LPR分類器(認識) を純C++→WASM 2モジュールでブラウザ内連結。
     画像は送信されません。検出は 83層 yolox-tiny を単スレで走らせるため数秒かかります。</p>
  <div id="status">モデル読み込み中…</div>
  <div class="stage"><video id="cam" autoplay playsinline muted></video><canvas id="ov"></canvas></div>
  <div class="row">
    <button id="startCam" class="ghost">カメラ開始</button>
    <button id="rec" disabled>検出＆認識</button>
    <label class="mut">conf <input id="conf" type="range" min="0.1" max="0.7" step="0.05" value="0.3"><span id="cv">0.30</span></label>
  </div>
  <div id="plates"></div>
  <p class="mut" style="margin-top:14px"><code>http://localhost</code> か HTTPS で開いてください。車のナンバープレートが写るように向けて「検出＆認識」。</p>
</div>

<canvas id="frame" hidden></canvas><canvas id="crop" width="128" height="128" hidden></canvas>
<script src="yolox.js"></script>
<script src="lpr.js"></script>
<script>
const $ = id => document.getElementById(id);
const statusEl = $('status'), ov = $('ov'), octx = ov.getContext('2d');
const frame = $('frame'), fctx = frame.getContext('2d', { willReadFrequently: true });
const crop = $('crop'), cctx = crop.getContext('2d', { willReadFrequently: true });
let YO = null, LP = null, ready = 0, stream = null;

const REGION = ['札幌','函館','旭川','室蘭','苫小牧','釧路','知床','帯広','北見','青森','弘前','八戸','岩手','盛岡','平泉','宮城','仙台','秋田','山形','庄内','福島','会津','郡山','白河','いわき','水戸','土浦','つくば','宇都宮','那須','とちぎ','群馬','前橋','高崎','大宮','川口','所沢','川越','熊谷','春日部','越谷','千葉','成田','習志野','市川','船橋','袖ヶ浦','市原','野田','柏','松戸','品川','世田谷','練馬','杉並','板橋','足立','江東','葛飾','八王子','多摩','横浜','川崎','湘南','相模','山梨','富士山','新潟','長岡','上越','長野','松本','諏訪','富山','石川','金沢','福井','岐阜','飛騨','静岡','浜松','沼津','伊豆','名古屋','豊橋','三河','岡崎','豊田','尾張小牧','一宮','春日井','三重','鈴鹿','四日市','伊勢志摩','滋賀','京都','なにわ','大阪','和泉','堺','奈良','飛鳥','和歌山','神戸','姫路','鳥取','島根','出雲','岡山','倉敷','広島','福山','山口','下関','徳島','香川','高松','愛媛','高知','福岡','北九州','久留米','筑豊','佐賀','長崎','佐世保','熊本','大分','宮崎','鹿児島','奄美','沖縄'];
const HIRA = [...'あいうえかきくけこさすそせたちつてとなにぬねのはひふほまみむめもやゆよらりるれろわをABCEHKLMTYV'];
const CN01=[...'0123456789'], CN02=[...'0123456789ACFHKLMPXY'], CN03=[...'0123456789ACFHKLMPXY '];
function decode(o) { const region=REGION[o[0]]??'?'; let cls=''; if(o[1]<CN01.length)cls+=CN01[o[1]]; if(o[2]<CN02.length)cls+=CN02[o[2]]; if(o[3]<CN03.length)cls+=CN03[o[3]];
  const hira=HIRA[o[4]]??'?'; let num=''; for(const v of [o[5],o[6],o[7],o[8]]) if(v!==10) num+=String(v); return {region,cls:cls.trim(),hira,num}; }

Promise.all([
  createYOLOX().then(async m => { YO=m; const b=await (await fetch('../yolox/plate_yolox_tiny.onnx')).arrayBuffer();
    try{m.FS.mkdir('/plate');}catch(e){} m.FS.writeFile('/plate/model.onnx', new Uint8Array(b)); m._fn_ready(); }),
  createLPR().then(async m => { LP=m; const man=await (await fetch('../pure/ref/manifest.txt')).text();
    const w=new Uint8Array(await (await fetch('../pure/ref/weights.bin')).arrayBuffer());
    try{m.FS.mkdir('/lpr');}catch(e){} m.FS.writeFile('/lpr/manifest.txt',man); m.FS.writeFile('/lpr/weights.bin',w); m._fn_ready(); }),
]).then(() => { ready=1; statusEl.textContent='モデル準備完了。カメラを開始してください。'; sync(); })
  .catch(e => statusEl.textContent='読み込み失敗: '+e);

$('startCam').onclick = async () => { try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  $('cam').srcObject=stream; statusEl.textContent='カメラ ON。プレートを写して「検出＆認識」。'; sync(); }
  catch(e){ statusEl.textContent='カメラエラー: '+e.message; } };
function sync(){ $('rec').disabled = !(ready && stream); }
$('conf').oninput = () => $('cv').textContent = parseFloat($('conf').value).toFixed(2);

function recognizeCrop(x1,y1,x2,y2) {                       // crop frame box -> 128x128 -> lpr -> decode
  const w=Math.max(1,x2-x1), h=Math.max(1,y2-y1);
  cctx.drawImage(frame, x1,y1,w,h, 0,0,128,128);
  const data=cctx.getImageData(0,0,128,128).data;
  const ptr=LP._malloc(data.length); LP.HEAPU8.set(data,ptr);
  const outPtr=LP._fn_recognize(ptr); const o=[]; for(let i=0;i<9;i++) o.push(LP.HEAP32[(outPtr>>2)+i]); LP._free(ptr);
  return decode(o);
}

$('rec').onclick = () => {
  const v=$('cam'); const W=v.videoWidth, H=v.videoHeight;
  frame.width=W; frame.height=H; fctx.drawImage(v,0,0,W,H);
  ov.width=W; ov.height=H; octx.clearRect(0,0,W,H);
  statusEl.textContent='検出中…（数秒）';
  setTimeout(() => {                                        // let the status paint before the blocking detect
    const img=fctx.getImageData(0,0,W,H).data;
    const ptr=YO._malloc(img.length); YO.HEAPU8.set(img,ptr);
    const n=YO._fn_detect(ptr, W, H, Math.round(parseFloat($('conf').value)*100));
    const bp=YO._fn_boxes()>>2; const boxes=[]; for(let i=0;i<n;i++) boxes.push([YO.HEAPF32[bp+i*5],YO.HEAPF32[bp+i*5+1],YO.HEAPF32[bp+i*5+2],YO.HEAPF32[bp+i*5+3],YO.HEAPF32[bp+i*5+4]]);
    YO._free(ptr);
    $('plates').innerHTML=''; octx.strokeStyle='#3ddc84'; octx.lineWidth=Math.max(2,W/300); octx.font=`${Math.round(W/40)}px sans-serif`; octx.fillStyle='#3ddc84';
    let out=[];
    for(const [x1,y1,x2,y2,sc] of boxes) {
      const d=recognizeCrop(x1|0,y1|0,x2|0,y2|0);
      octx.strokeRect(x1,y1,x2-x1,y2-y1); octx.fillText(`${d.region} ${d.hira} ${d.num}`, x1, Math.max(12,y1-4));
      out.push(`<div class="plate"><div class="region">${d.region} <span style="color:#333">${d.cls}</span></div><div class="big">${d.hira} ${d.num||'----'}</div></div>`);
    }
    $('plates').innerHTML = out.join('') || '<span class="mut">プレートが検出されませんでした（conf を下げる/近づける）</span>';
    statusEl.textContent=`検出 ${n} 件。`;
  }, 50);
};
</script>
</body>
</html>
